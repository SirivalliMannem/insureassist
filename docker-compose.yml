services:
  # ==============================================================================
  # 1. PostgreSQL Relational Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: insureassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: insureassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: insureassist
    ports:
      - "5435:5432"
    volumes:
      - insureassist_pgdata:/var/lib/postgresql/data
    networks:
      - insureassist-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureassist -d insureassist"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. Authentication Microservice (JWT & User Identity)
  # ==============================================================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    image: insureassist-auth
    container_name: insureassist-auth-container
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: "InsureAssist Auth Service"
      APP_ENV: "development"
      PORT: 8001
      HOST: "0.0.0.0"
      JWT_SECRET_KEY: "insureassist-super-secret-jwt-key-for-development-mode"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: "postgresql://insureassist:Test%40123@postgres:5432/insureassist"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000,*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insureassist-network

  # ==============================================================================
  # 3. Customer Microservice (Policies, Claims/FNOL, Renewals, Profiles)
  # ==============================================================================
  customer-service:
    build:
      context: ./backend/customer-service
      dockerfile: Dockerfile
    image: insureassist-customer
    container_name: insureassist-customer-container
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: "InsureAssist Customer Service"
      APP_ENV: "development"
      PORT: 8002
      HOST: "0.0.0.0"
      JWT_SECRET_KEY: "insureassist-super-secret-jwt-key-for-development-mode"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: "postgresql://insureassist:Test%40123@postgres:5432/insureassist"
      EXCEL_DATASET_PATH: "/app/data/pc_insurance_large_dataset.xlsx"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000,*"
    volumes:
      - "C:/Users/i-sirivalli.mannem/Downloads/pc_insurance_large_dataset.xlsx:/app/data/pc_insurance_large_dataset.xlsx:ro"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insureassist-network

  # ==============================================================================
  # 4. Agent Microservice (Portfolio, Dashboard, Assigned Records)
  # ==============================================================================
  agent-service:
    build:
      context: ./backend/agent-service
      dockerfile: Dockerfile
    image: insureassist-agent
    container_name: insureassist-agent-container
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      APP_NAME: "InsureAssist Agent Service"
      APP_ENV: "development"
      PORT: 8003
      HOST: "0.0.0.0"
      JWT_SECRET_KEY: "insureassist-super-secret-jwt-key-for-development-mode"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: "postgresql://insureassist:Test%40123@postgres:5432/insureassist"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000,*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insureassist-network

  # ==============================================================================
  # 5. Underwriter Microservice (Review Queue, Decisions, Risk Analytics)
  # ==============================================================================
  underwriter-service:
    build:
      context: ./backend/underwriter-service
      dockerfile: Dockerfile
    image: insureassist-underwriter
    container_name: insureassist-underwriter-container
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      APP_NAME: "InsureAssist Underwriter Service"
      APP_ENV: "development"
      PORT: 8004
      HOST: "0.0.0.0"
      JWT_SECRET_KEY: "insureassist-super-secret-jwt-key-for-development-mode"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: "postgresql://insureassist:Test%40123@postgres:5432/insureassist"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000,*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insureassist-network

  # ==============================================================================
  # 6. Admin Microservice (User Management, System Health, Audit Logs)
  # ==============================================================================
  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    image: insureassist-admin
    container_name: insureassist-admin-container
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      APP_NAME: "InsureAssist Admin Service"
      APP_ENV: "development"
      PORT: 8005
      HOST: "0.0.0.0"
      JWT_SECRET_KEY: "insureassist-super-secret-jwt-key-for-development-mode"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: "postgresql://insureassist:Test%40123@postgres:5432/insureassist"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000,*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insureassist-network

volumes:
  insureassist_pgdata:
    name: insureassist_pgdata

networks:
  insureassist-network:
    name: insureassist-network
    driver: bridge
